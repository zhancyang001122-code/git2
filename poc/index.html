<!doctype html>
<html lang="zh-CN" data-theme="editorial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ArchFlow AI 建筑方案设计与出图辅助平台视觉 POC" />
  <title>ArchFlow — Visual POC</title>
  <style>
    :root {
      --bg: #fff7e9;
      --surface: #fffdf7;
      --surface-2: #f7eed9;
      --ink: #111111;
      --muted: #746d64;
      --accent: #f66f00;
      --accent-2: #fccc3c;
      --on-accent: #111111;
      --border: #dacab6;
      --sidebar: #111111;
      --sidebar-ink: #fff7e9;
      --sidebar-muted: #aaa49a;
      --success: #2a7c55;
      --danger: #b83b32;
      --shadow: 0 18px 60px rgba(68, 48, 24, .12);
      --shadow-soft: 0 8px 28px rgba(68, 48, 24, .08);
      --radius-xs: 3px;
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 18px;
      --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --body: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --sidebar-width: 244px;
      color-scheme: light;
    }

    html[data-theme="blueprint"] {
      --bg: #eef4f6;
      --surface: #fbfdfe;
      --surface-2: #dbe8ed;
      --ink: #102a43;
      --muted: #5b7082;
      --accent: #0077b6;
      --accent-2: #48cae4;
      --on-accent: #ffffff;
      --border: #b7cbd4;
      --sidebar: #f8fbfc;
      --sidebar-ink: #102a43;
      --sidebar-muted: #627d98;
      --success: #12735a;
      --danger: #b4232c;
      --shadow: 0 18px 60px rgba(16, 42, 67, .12);
      --shadow-soft: 0 8px 28px rgba(16, 42, 67, .08);
      --radius-xs: 0;
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --display: "Helvetica Neue", "PingFang SC", Arial, sans-serif;
      color-scheme: light;
    }

    html[data-theme="night"] {
      --bg: #0d0e0d;
      --surface: #171816;
      --surface-2: #22231f;
      --ink: #f8f3e8;
      --muted: #aaa49a;
      --accent: #ff7a1a;
      --accent-2: #ffd166;
      --on-accent: #111111;
      --border: #34362f;
      --sidebar: rgba(18, 19, 17, .94);
      --sidebar-ink: #f8f3e8;
      --sidebar-muted: #8d8f85;
      --success: #77d9a0;
      --danger: #ff8379;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
      --shadow-soft: 0 12px 36px rgba(0, 0, 0, .26);
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 28px;
      --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.5;
      transition: background .35s var(--ease), color .35s var(--ease);
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 52%, transparent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .app-shell { min-height: 100dvh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      color: var(--sidebar-ink);
      border-right: 1px solid color-mix(in srgb, var(--border) 48%, transparent);
      z-index: 40;
      transition: transform .3s var(--ease), background .35s var(--ease);
    }

    html[data-theme="blueprint"] .sidebar {
      background-image:
        linear-gradient(color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    html[data-theme="night"] .sidebar { backdrop-filter: blur(22px); }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 8px 28px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--on-accent);
      border-radius: var(--radius-sm);
      transform: rotate(-3deg);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name {
      font-family: var(--display);
      font-size: 19px;
      letter-spacing: -.04em;
      line-height: 1;
    }
    .brand-sub {
      display: block;
      margin-top: 5px;
      color: var(--sidebar-muted);
      font: 10px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .project-switcher {
      margin: 0 4px 18px;
      padding: 10px 11px;
      border: 1px solid color-mix(in srgb, var(--sidebar-ink) 16%, transparent);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--sidebar-ink) 6%, transparent);
    }
    .project-switcher span { display: block; color: var(--sidebar-muted); font: 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .project-switcher strong { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .nav-label { padding: 0 10px 8px; color: var(--sidebar-muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      min-height: 42px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--sidebar-muted);
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: left;
      transition: color .2s, background .2s, transform .2s;
    }
    .nav-item:hover { color: var(--sidebar-ink); background: color-mix(in srgb, var(--sidebar-ink) 7%, transparent); }
    .nav-item:active { transform: translateY(1px); }
    .nav-item.active { color: var(--on-accent); background: var(--accent); }
    .nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; stroke-width: 1.7; }
    .nav-item span { font-size: 13px; font-weight: 550; }
    .nav-spacer { height: 9px; }

    .sidebar-bottom { margin-top: auto; display: grid; gap: 10px; }
    .api-status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border: 1px solid color-mix(in srgb, var(--sidebar-ink) 15%, transparent);
      border-radius: var(--radius-md);
      color: var(--sidebar-muted);
      font-size: 11px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 16%, transparent); }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px;
    }
    .avatar { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); font: 700 11px var(--mono); }
    .profile strong { display: block; font-size: 12px; }
    .profile small { display: block; color: var(--sidebar-muted); font-size: 10px; }

    .main-shell { min-height: 100dvh; margin-left: var(--sidebar-width); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 70px;
      padding: 0 clamp(18px, 3vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      backdrop-filter: blur(18px);
    }
    .top-left { min-width: 0; display: flex; align-items: center; gap: 14px; }
    .menu-button { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); }
    .menu-button svg { width: 19px; }
    .breadcrumb { min-width: 0; }
    .breadcrumb small { display: block; color: var(--muted); font: 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .breadcrumb strong { display: block; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }

    .theme-switcher { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-soft); }
    .theme-button {
      min-width: 86px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: calc(var(--radius-sm) - 1px);
      background: transparent;
      color: var(--muted);
      font: 10px/1 var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }
    .theme-button:hover { color: var(--ink); }
    .theme-button.active { color: var(--on-accent); background: var(--accent); }

    .poc-badge { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .poc-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

    .content { width: min(1540px, 100%); margin: 0 auto; padding: clamp(24px, 4vw, 58px); }
    .view { animation: viewIn .45s var(--ease) both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
    .page-heading { margin: 14px 0 0; font-family: var(--display); font-size: clamp(36px, 5.4vw, 84px); line-height: .96; letter-spacing: -.065em; max-width: 930px; }
    .page-heading em { color: var(--accent); font-style: normal; }
    .section-title { margin: 0; font-family: var(--display); font-size: clamp(25px, 3vw, 42px); line-height: 1.02; letter-spacing: -.045em; }
    .section-copy { max-width: 650px; color: var(--muted); font-size: 15px; }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(420px, .96fr);
      min-height: 570px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero-copy { padding: clamp(34px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; }
    .hero-copy p { max-width: 610px; margin: 26px 0 0; color: var(--muted); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.55; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
    .btn {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-weight: 650;
      font-size: 13px;
      transition: transform .2s var(--ease), box-shadow .2s, background .2s, color .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-ghost { background: transparent; color: var(--ink); border-color: transparent; }
    .btn svg { width: 17px; height: 17px; }

    .hero-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 48px; }
    .hero-stat { padding-top: 12px; border-top: 1px solid var(--border); }
    .hero-stat strong { display: block; font-family: var(--display); font-size: 22px; letter-spacing: -.04em; }
    .hero-stat span { display: block; margin-top: 4px; color: var(--muted); font: 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .07em; }

    .arch-visual { position: relative; min-height: 100%; overflow: hidden; background: var(--accent-2); isolation: isolate; }
    .arch-visual::before { content: ""; position: absolute; width: 46%; aspect-ratio: 1; right: -7%; top: 8%; border-radius: 50%; background: color-mix(in srgb, white 82%, var(--accent-2)); opacity: .95; }
    .arch-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 42%, rgba(17, 17, 17, .18)); z-index: 5; pointer-events: none; }
    .building { position: absolute; bottom: 0; background: color-mix(in srgb, var(--ink) 88%, transparent); box-shadow: inset -1px 0 rgba(255,255,255,.12); }
    .building::after { content: ""; position: absolute; inset: 12px; background: repeating-linear-gradient(90deg, transparent 0 24px, color-mix(in srgb, var(--accent-2) 74%, transparent) 25px 28px); opacity: .42; }
    .building-a { left: 7%; width: 31%; height: 57%; clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%); }
    .building-b { left: 35%; width: 38%; height: 76%; clip-path: polygon(0 8%, 83% 0, 100% 100%, 0 100%); }
    .building-c { right: -6%; width: 38%; height: 49%; clip-path: polygon(0 0, 100% 16%, 100% 100%, 8% 100%); }
    .visual-label { position: absolute; left: 26px; top: 24px; z-index: 8; padding: 8px 10px; background: var(--surface); color: var(--ink); border-radius: var(--radius-xs); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .visual-index { position: absolute; right: 22px; bottom: 18px; z-index: 8; color: color-mix(in srgb, white 92%, transparent); font: 11px/1 var(--mono); }

    html[data-theme="blueprint"] .arch-visual {
      background:
        linear-gradient(color-mix(in srgb, white 82%, transparent), color-mix(in srgb, white 82%, transparent)),
        repeating-linear-gradient(0deg, transparent 0 29px, color-mix(in srgb, var(--accent) 18%, transparent) 30px),
        repeating-linear-gradient(90deg, transparent 0 29px, color-mix(in srgb, var(--accent) 18%, transparent) 30px),
        var(--accent-2);
    }
    html[data-theme="blueprint"] .arch-visual::before { border: 1px solid var(--accent); background: transparent; }
    html[data-theme="blueprint"] .building { background: color-mix(in srgb, var(--accent) 15%, transparent); border: 2px solid var(--accent); box-shadow: none; }
    html[data-theme="blueprint"] .building::after { background: repeating-linear-gradient(90deg, transparent 0 24px, var(--accent) 25px 26px); opacity: .2; }

    html[data-theme="night"] .arch-visual { background: radial-gradient(circle at 73% 21%, #ff9c45 0 8%, transparent 27%), linear-gradient(155deg, #342115 0%, #131513 52%, #080908 100%); }
    html[data-theme="night"] .arch-visual::before { background: #ff9c45; filter: blur(18px); opacity: .55; }
    html[data-theme="night"] .building { background: linear-gradient(90deg, #252825, #111310); border-top: 1px solid #5e5146; }

    .home-section { margin-top: clamp(56px, 7vw, 100px); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 24px; }
    .section-head .section-copy { margin: 0; }
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .module-card {
      min-height: 220px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      transition: transform .25s var(--ease), background .25s, box-shadow .25s;
    }
    .module-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); background: color-mix(in srgb, var(--surface) 84%, var(--accent-2)); }
    .module-card .num { color: var(--muted); font: 10px/1 var(--mono); }
    .module-icon { width: 42px; height: 42px; margin: 32px 0 23px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
    .module-icon svg { width: 21px; height: 21px; stroke-width: 1.6; }
    .module-card h3 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .module-card p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .module-card .arrow { margin-top: auto; align-self: flex-end; font-size: 18px; transition: transform .2s; }
    .module-card:hover .arrow { transform: translateX(4px); }

    .demo-path { display: grid; grid-template-columns: .78fr 1.22fr; gap: 14px; }
    .path-intro { padding: clamp(26px, 4vw, 48px); border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); }
    .path-intro .eyebrow { color: color-mix(in srgb, var(--on-accent) 65%, transparent); }
    .path-intro .eyebrow::before { background: var(--on-accent); }
    .path-intro h2 { margin: 58px 0 0; font-family: var(--display); font-size: clamp(30px, 4vw, 56px); line-height: .98; letter-spacing: -.05em; }
    .path-steps { display: grid; grid-template-rows: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
    .path-step { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 16px; padding: 22px; border-bottom: 1px solid var(--border); }
    .path-step:last-child { border-bottom: 0; }
    .step-no { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); font: 11px var(--mono); }
    .path-step strong { display: block; font-size: 14px; }
    .path-step span { color: var(--muted); font-size: 12px; }
    .step-tag { padding: 5px 8px; background: var(--surface-2); border-radius: var(--radius-xs); font: 9px/1 var(--mono); text-transform: uppercase; }

    .feature-header { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 34px; }
    .feature-header .page-heading { font-size: clamp(42px, 5vw, 72px); }
    .feature-number { color: var(--muted); font: clamp(52px, 8vw, 116px)/.8 var(--mono); letter-spacing: -.08em; opacity: .28; }
    .workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; align-items: start; }
    .workspace-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-soft); }
    .prompt-panel { padding: clamp(22px, 3vw, 34px); }
    .panel-kicker { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .panel-kicker span { color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .ai-label { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; background: var(--surface-2); border-radius: var(--radius-xs); color: var(--ink) !important; letter-spacing: .04em !important; }
    .ai-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .prompt-title { margin: 0 0 9px; font-size: 18px; letter-spacing: -.02em; }
    .prompt-help { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip { min-height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; transition: border .2s, color .2s, background .2s; }
    .chip:hover { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .prompt-box { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; transition: border .2s, box-shadow .2s; }
    .prompt-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
    .prompt-box textarea { width: 100%; min-height: 168px; padding: 18px; resize: vertical; border: 0; outline: 0; background: transparent; font-size: 15px; line-height: 1.62; }
    .prompt-box textarea::placeholder { color: color-mix(in srgb, var(--muted) 74%, transparent); }
    .prompt-tools { min-height: 52px; padding: 8px 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); }
    .tool-group { display: flex; gap: 6px; align-items: center; }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--muted); }
    .icon-button:hover { color: var(--ink); background: var(--surface-2); }
    .icon-button svg { width: 17px; height: 17px; }
    .char-count { color: var(--muted); font: 10px var(--mono); }
    .upload-zone { margin-top: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--muted); background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
    .upload-zone strong { color: var(--ink); font-size: 12px; }
    .upload-zone span { font-size: 11px; }
    .upload-zone input { display: none; }
    .upload-zone label { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface); color: var(--ink); font-size: 11px; cursor: pointer; }
    .prompt-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 18px; }

    .delete-button { flex: 0 0 auto; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: transparent; color: var(--muted); }
    .delete-button:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); color: var(--danger); }
    .delete-button svg { width: 13px; }
    .danger-button { border-color: var(--danger); background: var(--danger); color: white; }
    .danger-button:hover { filter: brightness(.94); }
    .confirm-message { padding: 18px; border: 1px solid color-mix(in srgb, var(--danger) 32%, var(--border)); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--danger) 7%, var(--surface)); }
    .confirm-message strong { display: block; font-size: 15px; }
    .confirm-message p { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
    .empty-assets { grid-column: 1 / -1; padding: 46px 24px; text-align: center; }
    .empty-assets h3 { margin: 0; font-size: 18px; }
    .empty-assets p { max-width: 420px; margin: 9px auto 18px; color: var(--muted); font-size: 11px; }
    .render-dialog-preview { background: linear-gradient(#bfd5d8 0 52%, #73866d 53% 100%); }

    .asset-toolbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: 28px 0 22px; }
    .search-wrap { min-width: min(340px, 100%); display: flex; align-items: center; gap: 9px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .search-wrap svg { width: 17px; color: var(--muted); }
    .search-wrap input { width: 100%; height: 42px; border: 0; outline: 0; background: transparent; font-size: 12px; }
    .filter-row { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter-button { height: 36px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--muted); font-size: 11px; }
    .filter-button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .asset-summary { display: grid; grid-template-columns: 1.3fr repeat(3, .7fr); gap: 10px; margin-top: 32px; }
    .summary-card { min-height: 104px; padding: 18px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
    .summary-card:first-child { background: var(--accent); color: var(--on-accent); }
    .summary-card span { display: block; font: 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; opacity: .68; }
    .summary-card strong { display: block; margin-top: 22px; font-family: var(--display); font-size: 26px; letter-spacing: -.045em; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .package-card { min-width: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-soft); transition: transform .25s var(--ease), box-shadow .25s; }
    .package-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .package-cover { position: relative; height: 214px; overflow: hidden; background: var(--surface-2); }
    .package-cover::after { content: ""; position: absolute; inset: auto 0 0; height: 42%; background: linear-gradient(transparent, rgba(0,0,0,.28)); pointer-events: none; }
    .sheet { position: absolute; width: 46%; height: 70%; top: 17%; border: 1px solid color-mix(in srgb, white 56%, transparent); border-radius: calc(var(--radius-sm) + 2px); box-shadow: 0 18px 35px rgba(0,0,0,.22); overflow: hidden; }
    .sheet::before { content: ""; position: absolute; inset: 0; background: linear-gradient(150deg, transparent 0 34%, rgba(255,255,255,.22) 35% 43%, transparent 44%), repeating-linear-gradient(90deg, transparent 0 18px, rgba(255,255,255,.16) 19px 20px); }
    .sheet.one { left: 8%; transform: rotate(-8deg); background: #53727f; }
    .sheet.two { left: 28%; top: 11%; transform: rotate(1deg); background: #d1a96f; z-index: 2; }
    .sheet.three { right: 5%; transform: rotate(8deg); background: #764c3f; z-index: 1; }
    .package-card[data-tone="cool"] .sheet.one { background: #5f7a8c; }
    .package-card[data-tone="cool"] .sheet.two { background: #b9d5db; }
    .package-card[data-tone="cool"] .sheet.three { background: #2f4f5f; }
    .package-card[data-tone="orange"] .sheet.one { background: #c95622; }
    .package-card[data-tone="orange"] .sheet.two { background: #f3b35b; }
    .package-card[data-tone="orange"] .sheet.three { background: #673629; }
    .package-card[data-tone="green"] .sheet.one { background: #314e40; }
    .package-card[data-tone="green"] .sheet.two { background: #9fb7a1; }
    .package-card[data-tone="green"] .sheet.three { background: #d3c7a5; }
    .cover-badge { position: absolute; z-index: 5; left: 14px; bottom: 13px; padding: 6px 8px; border-radius: var(--radius-xs); background: rgba(17,17,17,.78); color: white; font: 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .07em; backdrop-filter: blur(8px); }
    .package-body { padding: 17px; }
    .package-title-row { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .package-title-row h3 { min-width: 0; margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .more-button { flex: 0 0 auto; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: transparent; color: var(--muted); }
    .more-button svg { width: 14px; }
    .package-meta { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; color: var(--muted); font: 9px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
    .package-meta span:last-child { text-align: right; }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 90;
      max-width: 360px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s var(--ease);
    }
    .toast.show { opacity: 1; transform: none; }
    .toast-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--success); color: white; }
    .toast strong { display: block; font-size: 12px; }
    .toast span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }

    .dialog-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.54); backdrop-filter: blur(8px); }
    .dialog { width: min(680px, 100%); max-height: min(720px, 88dvh); overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: 0 30px 100px rgba(0,0,0,.38); }
    .dialog-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; padding: 24px; border-bottom: 1px solid var(--border); }
    .dialog-head h2 { margin: 6px 0 0; font-size: 22px; letter-spacing: -.035em; }
    .dialog-close { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: transparent; }
    .dialog-close svg { width: 16px; }
    .dialog-content { padding: 24px; }
    .dialog-preview { height: 280px; border-radius: var(--radius-md); background: linear-gradient(145deg, var(--accent-2), color-mix(in srgb, var(--accent) 42%, var(--ink))); position: relative; overflow: hidden; }
    .dialog-preview::before { content: ""; position: absolute; width: 64%; height: 74%; bottom: 0; left: 19%; background: var(--ink); clip-path: polygon(0 15%, 85% 0, 100% 100%, 10% 100%); opacity: .78; }
    .dialog-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .dialog-stat { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .dialog-stat span { display: block; color: var(--muted); font: 9px var(--mono); text-transform: uppercase; }
    .dialog-stat strong { display: block; margin-top: 10px; font-size: 13px; }

    @media (max-width: 1180px) {
      .hero-grid { grid-template-columns: 1fr .82fr; }
      .module-grid, .asset-grid { grid-template-columns: repeat(2, 1fr); }
      .workspace-grid { grid-template-columns: minmax(0, 1fr) 280px; }
      .theme-button { min-width: 68px; }
      .poc-badge { display: none; }
    }

    @media (max-width: 900px) {
      :root { --sidebar-width: 228px; }
      .sidebar { transform: translateX(-102%); box-shadow: 20px 0 70px rgba(0,0,0,.22); }
      .sidebar.open { transform: none; }
      .main-shell { margin-left: 0; }
      .menu-button { display: grid; }
      .topbar { height: auto; min-height: 68px; flex-wrap: wrap; padding-block: 12px; }
      .theme-switcher { order: 3; width: 100%; }
      .theme-button { flex: 1; }
      .hero-grid { grid-template-columns: 1fr; }
      .arch-visual { min-height: 390px; }
      .workspace-grid { grid-template-columns: 1fr; }
      .guide-panel { position: static; }
      .guide-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .guide-item { border-bottom: 0; }
      .asset-summary { grid-template-columns: repeat(2, 1fr); }
      .direction-grid, .case-grid, .design-option-grid { grid-template-columns: 1fr; }
      .direction-content > p { min-height: 0; }
      .model-output-grid, .report-output-grid { grid-template-columns: 1fr; }
      .render-gallery { grid-template-columns: 1fr 1fr; }
      .render-card.secondary .render-image { min-height: 350px; }
      .sidebar-scrim { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.42); }
    }

    @media (max-width: 640px) {
      .content { padding: 22px 16px 42px; }
      .hero-copy { padding: 28px 22px; }
      .page-heading { font-size: clamp(42px, 14vw, 62px); }
      .hero-foot { grid-template-columns: 1fr; }
      .arch-visual { min-height: 310px; }
      .module-grid, .asset-grid { grid-template-columns: 1fr; }
      .section-head, .feature-header, .asset-toolbar, .prompt-bottom, .result-head { align-items: stretch; flex-direction: column; }
      .demo-path { grid-template-columns: 1fr; }
      .path-step { grid-template-columns: 44px 1fr; }
      .step-tag { grid-column: 2; justify-self: start; }
      .workspace-grid { gap: 12px; }
      .guide-list { grid-template-columns: 1fr; }
      .result-grid { grid-template-columns: 1fr; }
      .output-section-head { align-items: start; flex-direction: column; }
      .moodboard-strip { grid-template-columns: 1fr 1fr; }
      .mood-swatch:first-child { min-height: 94px; }
      .change-list { grid-template-columns: 1fr 1fr; }
      .compare-stage { height: 250px; }
      .render-gallery { grid-template-columns: 1fr; }
      .render-image, .render-card.secondary .render-image { min-height: 280px; }
      .ppt-preview { grid-template-columns: 64px minmax(0,1fr); min-height: 280px; }
      .slide-canvas-wrap { padding: 12px; }
      .a3-grid { grid-template-columns: 1fr; }
      .asset-summary { grid-template-columns: 1fr 1fr; }
      .filter-row { width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
      .filter-button { white-space: nowrap; }
      .search-wrap { width: 100%; min-width: 0; }
      .feature-number { display: none; }
      .topbar { padding-inline: 14px; }
      .breadcrumb strong { max-width: 180px; }
      .toast { right: 14px; left: 14px; bottom: 14px; }
      .dialog-stats { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <script>
    const icon = (name) => {
      const paths = {
        home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',
        spark: '<path d="m12 3 1.3 4.2L17 9l-3.7 1.8L12 15l-1.3-4.2L7 9l3.7-1.8L12 3Z"/><path d="m19 15 .8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15ZM5 3l.7 1.8L7.5 5 5.7 5.7 5 7.5l-.7-1.8L2.5 5l1.8-.7L5 3Z"/>',
        pen: '<path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Z"/><path d="m13.8 7.4 3 3M4 20h6"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',
        cube: '<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 7 9 5 9-5M3 12l9 5 9-5M3 17l9 5 9-5"/>',

        report: '<path d="M5 3h11l3 3v15H5z"/><path d="M16 3v4h4M8 12h8M8 16h8M8 8h3"/>',
        folder: '<path d="M3 6h7l2 2h9v11H3z"/>',
        paperclip: '<path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',
        send: '<path d="m22 2-7 20-4-9-9-4 20-7Z"/><path d="M22 2 11 13"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
        dots: '<circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="19" cy="12" r="1" fill="currentColor"/>',

        trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>',

      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">${paths[name] || paths.spark}</svg>`;
    };

    const features = [
      {
        id: 'inspiration', nav: 'AI 方案灵感', title: '让场地，先开口说话。', short: '设计方向、案例检索与 Mood Board', icon: 'spark', number: '01', upload: true,

        hints: [
          ['基本指标', '必填', '建筑类型、面积、用地面积、高度'],
          ['基地条件', '必填', '出入口、景观面、日照与周边约束'],
          ['设计目标', '建议', '效率、形象、公共性或可持续目标'],
          ['任务资料', '可选', '任务书或文字/PDF 资料']

      },
      {
        id: 'beautify', nav: 'AI 图纸美化', title: '保留设计，只提升表达。', short: '总图 / 平面图填彩与层次增强', icon: 'image', number: '03', upload: true,
        chips: ['总平面图', '低饱和', '景观增强', '道路分级', '竞赛图纸'],
        sample: '美化这张建筑总平面图，保持建筑轮廓、道路和空间布局不变。采用低饱和竞赛图纸风格，增强建筑、道路、水体和绿地层次，补充适量树木与阴影，画面干净、克制。',
        hints: [

          ['保持不变', '建议', '明确不修改的轮廓、道路与布局']

      },
      {
        id: 'model', nav: 'AI 建模', title: '从二维证据，重建空间。', short: '图片 / CAD 到可编辑基础模型', icon: 'cube', number: '04', upload: true,
        chips: ['SketchUp', 'Rhino', '基础体块', '立面开窗', '层高 4.2m'],
        sample: '根据上传的平面、立面和建筑参考图生成可编辑的基础建筑模型。建筑共 4 层，标准层高 4.2m，优先保证体块比例、层高、主要开口与中庭位置，目标格式为 SketchUp .skp。',
        hints: [
          ['几何依据', '必填', '平立剖、模型截图或多角度参考图'],
          ['关键尺寸', '建议', '总高、层高、开间与主要进深'],

    function bindModuleResultEvents(feature) {
      if (feature.id === 'design') {
        document.querySelectorAll('[data-select-scheme]').forEach(button => button.addEventListener('click', () => {
          const option = button.dataset.selectScheme;
          state.generated.design.selectedOption = option;
          document.querySelectorAll('[data-option-card]').forEach(card => card.classList.toggle('selected', card.dataset.optionCard === option));
          document.querySelectorAll('[data-select-scheme]').forEach(item => {
            const active = item.dataset.selectScheme === option;
            item.setAttribute('aria-pressed', String(active));
            item.textContent = active ? `已选择方案 ${option}` : `选择方案 ${item.dataset.selectScheme}`;
            item.closest('.design-option').querySelector('.option-status').textContent = active ? 'Selected' : 'Candidate';

          showToast(`已选择方案 ${option}`, '保存时只沉淀当前选择的深化方向。');
        }));

      document.querySelector('[data-compare-slider]')?.addEventListener('input', event => {
        document.getElementById('compareStage').style.setProperty('--reveal', `${event.target.value}%`);
      });

      document.querySelectorAll('[data-model-action]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.modelAction;
        let rotation = Number(modelObject.dataset.rotation || -32);
        let scale = Number(modelObject.dataset.scale || 1);
        if (action === 'rotate') rotation += 24;
        if (action === 'zoom') scale = scale >= 1.32 ? .86 : scale + .16;
        if (action === 'reset') { rotation = -32; scale = 1; }
        modelObject.dataset.rotation = rotation;
        modelObject.dataset.scale = scale;
        modelObject.style.setProperty('--rotation', `${rotation}deg`);
        modelObject.style.setProperty('--scale', scale);

      document.querySelectorAll('[data-view-render]').forEach(button => button.addEventListener('click', () => openRenderPreview(button.dataset.viewRender, button)));
      document.querySelectorAll('[data-report-slide]').forEach(button => button.addEventListener('click', () => {

        document.getElementById('reportSlideNumber').textContent = String(button.dataset.reportSlide).padStart(2, '0');

        <div class="asset-summary"><div class="summary-card"><span>Total assets</span><strong>${totalFiles} files</strong></div><div class="summary-card"><span>Project packages</span><strong>${assets.length}</strong></div><div class="summary-card"><span>Saved today</span><strong>${savedToday}</strong></div><div class="summary-card"><span>Storage estimate</span><strong>${storage}</strong></div></div>

      document.querySelectorAll('[data-filter]').forEach(btn => btn.addEventListener('click', () => {
        state.assetSearch = assetSearch.value;
        state.assetFilter = btn.dataset.filter;
        renderMine();

    function renderAssetGrid() {
      const grid = document.getElementById('assetGrid');
      if (!grid) return;
      const query = state.assetSearch.trim().toLowerCase();
      const filtered = assets.filter(a => (state.assetFilter === '全部' || a.type === state.assetFilter) && (!query || `${a.title}${a.type}${a.source}`.toLowerCase().includes(query)));
      const emptyMarkup = assets.length
        ? '<div class="panel empty-assets"><h3>没有匹配的项目包</h3><p>换一个关键词或筛选条件试试。</p></div>'
        : `<div class="panel empty-assets"><h3>资产库还是空的</h3><p>从任意 AI 功能生成结果并保存后，项目包会出现在这里。</p><button class="btn btn-primary" type="button" data-create-asset>开始生成 ${icon('arrow')}</button></div>`;
      grid.innerHTML = filtered.length ? filtered.map(a => `<article class="package-card" data-tone="${a.tone}">
        <button class="package-cover" type="button" data-asset-id="${a.id}" aria-label="打开${escapeHtml(a.title)}"><span class="sheet one"></span><span class="sheet two"></span><span class="sheet three"></span><span class="cover-badge">${a.type}</span></button>
        <div class="package-body"><div class="package-title-row"><h3>${escapeHtml(a.title)}</h3><div class="package-actions"><button class="more-button" type="button" data-asset-id="${a.id}" aria-label="查看${escapeHtml(a.title)}详情">${icon('dots')}</button><button class="delete-button" type="button" data-delete-id="${a.id}" aria-label="删除${escapeHtml(a.title)}">${icon('trash')}</button></div></div><div class="package-meta"><span>${a.files} Files<br>${a.source}</span><span>${a.time}<br>Local POC</span></div></div>

      grid.querySelectorAll('[data-delete-id]').forEach(btn => btn.addEventListener('click', () => confirmDeleteAsset(Number(btn.dataset.deleteId), btn)));
      grid.querySelector('[data-create-asset]')?.addEventListener('click', () => navigate('inspiration'));
    }

    function openAsset(id, trigger) {
      const asset = assets.find(a => a.id === id);
      if (!asset) return;
      showDialog('Asset package', asset.title, `<div class="dialog-preview"></div><div class="dialog-stats"><div class="dialog-stat"><span>Asset type</span><strong>${asset.type}</strong></div><div class="dialog-stat"><span>Files</span><strong>${asset.files} 个文件</strong></div><div class="dialog-stat"><span>Source</span><strong>${asset.source}</strong></div></div><div class="result-actions"><button class="btn btn-secondary" type="button" data-dialog-download>下载演示文件</button><button class="btn btn-secondary" type="button" data-dialog-delete>删除资产</button><button class="btn btn-primary" type="button" data-close-dialog>关闭</button></div>`, trigger);
      document.querySelector('[data-dialog-download]').addEventListener('click', () => showToast('下载接口已预留', `${asset.title}将在真实资产服务接入后打包下载。`));
      document.querySelector('[data-dialog-delete]').addEventListener('click', event => confirmDeleteAsset(asset.id, event.currentTarget));
    }

    function openRenderPreview(title, trigger) {
      showDialog('Render preview', title, `<div class="dialog-preview render-dialog-preview" aria-label="${title}大图预览"></div><div class="dialog-stats"><div class="dialog-stat"><span>Resolution</span><strong>4096 × 2304</strong></div><div class="dialog-stat"><span>Variation</span><strong>${title}</strong></div><div class="dialog-stat"><span>Status</span><strong>POC preview</strong></div></div><div class="result-actions"><button class="btn btn-secondary" type="button" data-dialog-download>下载大图</button><button class="btn btn-primary" type="button" data-close-dialog>关闭</button></div>`, trigger);
      document.querySelector('[data-dialog-download]').addEventListener('click', () => showToast('下载接口已预留', `${title}将在真实生图服务接入后下载。`));

    function confirmDeleteAsset(id, trigger) {
      const asset = assets.find(item => item.id === id);
      if (!asset) return;
      state.pendingDeleteId = id;
      const dialog = document.getElementById('assetDialog');
      const returnTarget = dialog.contains(trigger) ? state.dialogTrigger : trigger;
      showDialog('Delete asset', '删除资产包？', `<div class="confirm-message"><strong>${escapeHtml(asset.title)}</strong><p>删除后，这个项目包及其中 ${asset.files} 个演示文件会从“我的资产”移除。此 POC 不提供恢复操作。</p></div><div class="result-actions"><button class="btn btn-secondary" type="button" data-close-dialog data-autofocus>保留资产</button><button class="btn danger-button" type="button" data-confirm-delete>确认删除</button></div>`, returnTarget);
      document.querySelector('[data-confirm-delete]').addEventListener('click', () => deleteAsset(state.pendingDeleteId));
    }

    function deleteAsset(id) {
      const asset = assets.find(item => item.id === id);
      if (!asset) return;
      assets = assets.filter(item => item.id !== id);
      state.pendingDeleteId = null;
      closeDialog(false);
      if (state.view === 'mine') renderMine();
      showToast('资产已删除', `${asset.title}已从项目资产库移除。`);
    }

    function showDialog(eyebrow, title, markup, trigger) {
      const dialog = document.getElementById('assetDialog');
      if (trigger && !dialog.contains(trigger)) state.dialogTrigger = trigger;
      document.getElementById('assetDialogEyebrow').textContent = eyebrow;
      document.getElementById('assetDialogTitle').textContent = title;
      document.getElementById('assetDialogContent').innerHTML = markup;
      dialog.hidden = false;
      dialog.querySelectorAll('[data-close-dialog]').forEach(button => button.onclick = () => closeDialog());
      (dialog.querySelector('[data-autofocus]') || dialog.querySelector('.dialog-close')).focus();
    }

    function closeDialog(restoreFocus = true) {
      const dialog = document.getElementById('assetDialog');
      if (dialog.hidden) return;
      dialog.hidden = true;
      state.pendingDeleteId = null;
      if (restoreFocus && state.dialogTrigger?.isConnected) state.dialogTrigger.focus();
    }

    document.getElementById('assetDialog').addEventListener('click', event => { if (event.target.id === 'assetDialog') closeDialog(); });
    document.addEventListener('keydown', event => {
      const dialog = document.getElementById('assetDialog');
      if (!dialog.hidden) {
        if (event.key === 'Escape') { event.preventDefault(); closeDialog(); return; }
        if (event.key === 'Tab') {
          const focusable = [...dialog.querySelectorAll('button, a[href], input, [tabindex]:not([tabindex="-1"])')].filter(item => !item.disabled && item.offsetParent !== null);
          if (!focusable.length) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
          if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        }
      } else if (event.key === 'Escape') closeSidebar();
    });

    function showToast(title, message, success = true) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMessage').textContent = message;
      toast.querySelector('.toast-icon').textContent = success ? '✓' : '!';
      toast.querySelector('.toast-icon').style.background = success ? 'var(--success)' : 'var(--danger)';
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 3600);
    }

    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }

    document.querySelectorAll('[data-theme-value]').forEach(btn => btn.addEventListener('click', () => {
      const theme = btn.dataset.themeValue;
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll('[data-theme-value]').forEach(b => b.classList.toggle('active', b === btn));
      localStorage.setItem('archflow_poc_theme', theme);
    }));

    const savedTheme = localStorage.getItem('archflow_poc_theme');
    if (['editorial','blueprint','night'].includes(savedTheme)) {
      document.documentElement.dataset.theme = savedTheme;
      document.querySelectorAll('[data-theme-value]').forEach(btn => btn.classList.toggle('active', btn.dataset.themeValue === savedTheme));
    }

    const sidebar = document.getElementById('sidebar');
    const scrim = document.getElementById('sidebarScrim');
    document.getElementById('menuButton').addEventListener('click', () => { sidebar.classList.add('open'); scrim.hidden = false; });
    scrim.addEventListener('click', closeSidebar);
    function closeSidebar() { sidebar.classList.remove('open'); scrim.hidden = true; }

    document.getElementById('apiStatusButton').addEventListener('click', () => showToast('API 接口已预留', '本 POC 使用本地假数据，后续替换 generateWithApi 即可。'));

    renderNav();
    renderView();
  </script>
</body>
</html>
