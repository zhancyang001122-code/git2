<!doctype html>
<html lang="zh-CN" data-theme="editorial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ArchFlow AI 建筑方案设计与出图辅助平台视觉 POC" />
  <title>ArchFlow — Visual POC</title>
  <style>
    :root {
      --bg: #fff7e9;
      --surface: #fffdf7;
      --surface-2: #f7eed9;
      --ink: #111111;
      --muted: #746d64;
      --accent: #f66f00;
      --accent-2: #fccc3c;
      --on-accent: #111111;
      --border: #dacab6;
      --sidebar: #111111;
      --sidebar-ink: #fff7e9;
      --sidebar-muted: #aaa49a;
      --success: #2a7c55;
      --danger: #b83b32;
      --shadow: 0 18px 60px rgba(68, 48, 24, .12);
      --shadow-soft: 0 8px 28px rgba(68, 48, 24, .08);
      --radius-xs: 3px;
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 18px;
      --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      --body: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --ease: cubic-bezier(.16, 1, .3, 1);
      --sidebar-width: 244px;
      color-scheme: light;
    }

    html[data-theme="blueprint"] {
      --bg: #eef4f6;
      --surface: #fbfdfe;
      --surface-2: #dbe8ed;
      --ink: #102a43;
      --muted: #5b7082;
      --accent: #0077b6;
      --accent-2: #48cae4;
      --on-accent: #ffffff;
      --border: #b7cbd4;
      --sidebar: #f8fbfc;
      --sidebar-ink: #102a43;
      --sidebar-muted: #627d98;
      --success: #12735a;
      --danger: #b4232c;
      --shadow: 0 18px 60px rgba(16, 42, 67, .12);
      --shadow-soft: 0 8px 28px rgba(16, 42, 67, .08);
      --radius-xs: 0;
      --radius-sm: 2px;
      --radius-md: 4px;
      --radius-lg: 8px;
      --display: "Helvetica Neue", "PingFang SC", Arial, sans-serif;
      color-scheme: light;
    }

    html[data-theme="night"] {
      --bg: #0d0e0d;
      --surface: #171816;
      --surface-2: #22231f;
      --ink: #f8f3e8;
      --muted: #aaa49a;
      --accent: #ff7a1a;
      --accent-2: #ffd166;
      --on-accent: #111111;
      --border: #34362f;
      --sidebar: rgba(18, 19, 17, .94);
      --sidebar-ink: #f8f3e8;
      --sidebar-muted: #8d8f85;
      --success: #77d9a0;
      --danger: #ff8379;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
      --shadow-soft: 0 12px 36px rgba(0, 0, 0, .26);
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 28px;
      --display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.5;
      transition: background .35s var(--ease), color .35s var(--ease);
    }

    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 52%, transparent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .app-shell { min-height: 100dvh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      padding: 24px 16px 18px;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      color: var(--sidebar-ink);
      border-right: 1px solid color-mix(in srgb, var(--border) 48%, transparent);
      z-index: 40;
      transition: transform .3s var(--ease), background .35s var(--ease);
    }

    html[data-theme="blueprint"] .sidebar {
      background-image:
        linear-gradient(color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px),
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    html[data-theme="night"] .sidebar { backdrop-filter: blur(22px); }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 4px 8px 28px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--on-accent);
      border-radius: var(--radius-sm);
      transform: rotate(-3deg);
    }
    .brand-mark svg { width: 23px; height: 23px; }
    .brand-name {
      font-family: var(--display);
      font-size: 19px;
      letter-spacing: -.04em;
      line-height: 1;
    }
    .brand-sub {
      display: block;
      margin-top: 5px;
      color: var(--sidebar-muted);
      font: 10px/1 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .project-switcher {
      margin: 0 4px 18px;
      padding: 10px 11px;
      border: 1px solid color-mix(in srgb, var(--sidebar-ink) 16%, transparent);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--sidebar-ink) 6%, transparent);
    }
    .project-switcher span { display: block; color: var(--sidebar-muted); font: 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .project-switcher strong { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .nav-label { padding: 0 10px 8px; color: var(--sidebar-muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      min-height: 42px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--sidebar-muted);
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      text-align: left;
      transition: color .2s, background .2s, transform .2s;
    }
    .nav-item:hover { color: var(--sidebar-ink); background: color-mix(in srgb, var(--sidebar-ink) 7%, transparent); }
    .nav-item:active { transform: translateY(1px); }
    .nav-item.active { color: var(--on-accent); background: var(--accent); }
    .nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; stroke-width: 1.7; }
    .nav-item span { font-size: 13px; font-weight: 550; }
    .nav-spacer { height: 9px; }

    .sidebar-bottom { margin-top: auto; display: grid; gap: 10px; }
    .api-status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 11px;
      border: 1px solid color-mix(in srgb, var(--sidebar-ink) 15%, transparent);
      border-radius: var(--radius-md);
      color: var(--sidebar-muted);
      font-size: 11px;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-2) 16%, transparent); }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 7px;
    }
    .avatar { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink); font: 700 11px var(--mono); }
    .profile strong { display: block; font-size: 12px; }
    .profile small { display: block; color: var(--sidebar-muted); font-size: 10px; }

    .main-shell { min-height: 100dvh; margin-left: var(--sidebar-width); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 70px;
      padding: 0 clamp(18px, 3vw, 42px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
      backdrop-filter: blur(18px);
    }
    .top-left { min-width: 0; display: flex; align-items: center; gap: 14px; }
    .menu-button { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); }
    .menu-button svg { width: 19px; }
    .breadcrumb { min-width: 0; }
    .breadcrumb small { display: block; color: var(--muted); font: 10px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .breadcrumb strong { display: block; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }

    .theme-switcher { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-soft); }
    .theme-button {
      min-width: 86px;
      height: 34px;
      padding: 0 10px;
      border: 0;
      border-radius: calc(var(--radius-sm) - 1px);
      background: transparent;
      color: var(--muted);
      font: 10px/1 var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: background .2s, color .2s;
    }
    .theme-button:hover { color: var(--ink); }
    .theme-button.active { color: var(--on-accent); background: var(--accent); }

    .poc-badge { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .poc-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

    .content { width: min(1540px, 100%); margin: 0 auto; padding: clamp(24px, 4vw, 58px); }
    .view { animation: viewIn .45s var(--ease) both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .eyebrow { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font: 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
    .page-heading { margin: 14px 0 0; font-family: var(--display); font-size: clamp(36px, 5.4vw, 84px); line-height: .96; letter-spacing: -.065em; max-width: 930px; }
    .page-heading em { color: var(--accent); font-style: normal; }
    .section-title { margin: 0; font-family: var(--display); font-size: clamp(25px, 3vw, 42px); line-height: 1.02; letter-spacing: -.045em; }
    .section-copy { max-width: 650px; color: var(--muted); font-size: 15px; }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(420px, .96fr);
      min-height: 570px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero-copy { padding: clamp(34px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; }
    .hero-copy p { max-width: 610px; margin: 26px 0 0; color: var(--muted); font-size: clamp(16px, 1.3vw, 19px); line-height: 1.55; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
    .btn {
      min-height: 46px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font-weight: 650;
      font-size: 13px;
      transition: transform .2s var(--ease), box-shadow .2s, background .2s, color .2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--border); }
    .btn-ghost { background: transparent; color: var(--ink); border-color: transparent; }
    .btn svg { width: 17px; height: 17px; }

    .hero-foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 48px; }
    .hero-stat { padding-top: 12px; border-top: 1px solid var(--border); }
    .hero-stat strong { display: block; font-family: var(--display); font-size: 22px; letter-spacing: -.04em; }
    .hero-stat span { display: block; margin-top: 4px; color: var(--muted); font: 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .07em; }

    .arch-visual { position: relative; min-height: 100%; overflow: hidden; background: var(--accent-2); isolation: isolate; }
    .arch-visual::before { content: ""; position: absolute; width: 46%; aspect-ratio: 1; right: -7%; top: 8%; border-radius: 50%; background: color-mix(in srgb, white 82%, var(--accent-2)); opacity: .95; }
    .arch-visual::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 42%, rgba(17, 17, 17, .18)); z-index: 5; pointer-events: none; }
    .building { position: absolute; bottom: 0; background: color-mix(in srgb, var(--ink) 88%, transparent); box-shadow: inset -1px 0 rgba(255,255,255,.12); }
    .building::after { content: ""; position: absolute; inset: 12px; background: repeating-linear-gradient(90deg, transparent 0 24px, color-mix(in srgb, var(--accent-2) 74%, transparent) 25px 28px); opacity: .42; }
    .building-a { left: 7%; width: 31%; height: 57%; clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%); }
    .building-b { left: 35%; width: 38%; height: 76%; clip-path: polygon(0 8%, 83% 0, 100% 100%, 0 100%); }
    .building-c { right: -6%; width: 38%; height: 49%; clip-path: polygon(0 0, 100% 16%, 100% 100%, 8% 100%); }
    .visual-label { position: absolute; left: 26px; top: 24px; z-index: 8; padding: 8px 10px; background: var(--surface); color: var(--ink); border-radius: var(--radius-xs); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
    .visual-index { position: absolute; right: 22px; bottom: 18px; z-index: 8; color: color-mix(in srgb, white 92%, transparent); font: 11px/1 var(--mono); }

    html[data-theme="blueprint"] .arch-visual {
      background:
        linear-gradient(color-mix(in srgb, white 82%, transparent), color-mix(in srgb, white 82%, transparent)),
        repeating-linear-gradient(0deg, transparent 0 29px, color-mix(in srgb, var(--accent) 18%, transparent) 30px),
        repeating-linear-gradient(90deg, transparent 0 29px, color-mix(in srgb, var(--accent) 18%, transparent) 30px),
        var(--accent-2);
    }
    html[data-theme="blueprint"] .arch-visual::before { border: 1px solid var(--accent); background: transparent; }
    html[data-theme="blueprint"] .building { background: color-mix(in srgb, var(--accent) 15%, transparent); border: 2px solid var(--accent); box-shadow: none; }
    html[data-theme="blueprint"] .building::after { background: repeating-linear-gradient(90deg, transparent 0 24px, var(--accent) 25px 26px); opacity: .2; }

    html[data-theme="night"] .arch-visual { background: radial-gradient(circle at 73% 21%, #ff9c45 0 8%, transparent 27%), linear-gradient(155deg, #342115 0%, #131513 52%, #080908 100%); }
    html[data-theme="night"] .arch-visual::before { background: #ff9c45; filter: blur(18px); opacity: .55; }
    html[data-theme="night"] .building { background: linear-gradient(90deg, #252825, #111310); border-top: 1px solid #5e5146; }

    .home-section { margin-top: clamp(56px, 7vw, 100px); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 22px; margin-bottom: 24px; }
    .section-head .section-copy { margin: 0; }
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .module-card {
      min-height: 220px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      transition: transform .25s var(--ease), background .25s, box-shadow .25s;
    }
    .module-card:hover { transform: translateY(-5px); box-shadow: var(--shadow); background: color-mix(in srgb, var(--surface) 84%, var(--accent-2)); }
    .module-card .num { color: var(--muted); font: 10px/1 var(--mono); }
    .module-icon { width: 42px; height: 42px; margin: 32px 0 23px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
    .module-icon svg { width: 21px; height: 21px; stroke-width: 1.6; }
    .module-card h3 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .module-card p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .module-card .arrow { margin-top: auto; align-self: flex-end; font-size: 18px; transition: transform .2s; }
    .module-card:hover .arrow { transform: translateX(4px); }

    .demo-path { display: grid; grid-template-columns: .78fr 1.22fr; gap: 14px; }
    .path-intro { padding: clamp(26px, 4vw, 48px); border-radius: var(--radius-md); background: var(--accent); color: var(--on-accent); }
    .path-intro .eyebrow { color: color-mix(in srgb, var(--on-accent) 65%, transparent); }
    .path-intro .eyebrow::before { background: var(--on-accent); }
    .path-intro h2 { margin: 58px 0 0; font-family: var(--display); font-size: clamp(30px, 4vw, 56px); line-height: .98; letter-spacing: -.05em; }
    .path-steps { display: grid; grid-template-rows: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
    .path-step { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 16px; padding: 22px; border-bottom: 1px solid var(--border); }
    .path-step:last-child { border-bottom: 0; }
    .step-no { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); font: 11px var(--mono); }
    .path-step strong { display: block; font-size: 14px; }
    .path-step span { color: var(--muted); font-size: 12px; }
    .step-tag { padding: 5px 8px; background: var(--surface-2); border-radius: var(--radius-xs); font: 9px/1 var(--mono); text-transform: uppercase; }

    .feature-header { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 34px; }
    .feature-header .page-heading { font-size: clamp(42px, 5vw, 72px); }
    .feature-number { color: var(--muted); font: clamp(52px, 8vw, 116px)/.8 var(--mono); letter-spacing: -.08em; opacity: .28; }
    .workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 16px; align-items: start; }
    .workspace-main { min-width: 0; display: grid; gap: 16px; }
    .panel { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); box-shadow: var(--shadow-soft); }
    .prompt-panel { padding: clamp(22px, 3vw, 34px); }
    .panel-kicker { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 20px; }
    .panel-kicker span { color: var(--muted); font: 10px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; }
    .ai-label { display: inline-flex; align-items: center; gap: 7px; padding: 5px 8px; background: var(--surface-2); border-radius: var(--radius-xs); color: var(--ink) !important; letter-spacing: .04em !important; }
    .ai-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .prompt-title { margin: 0 0 9px; font-size: 18px; letter-spacing: -.02em; }
    .prompt-help { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .quick-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
    .chip { min-height: 30px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--muted); font-size: 11px; transition: border .2s, color .2s, background .2s; }
    .chip:hover { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .prompt-box { border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); overflow: hidden; transition: border .2s, box-shadow .2s; }
    .prompt-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent); }
    .prompt-box textarea { width: 100%; min-height: 168px; padding: 18px; resize: vertical; border: 0; outline: 0; background: transparent; font-size: 15px; line-height: 1.62; }
    .prompt-box textarea::placeholder { color: color-mix(in srgb, var(--muted) 74%, transparent); }
    .prompt-tools { min-height: 52px; padding: 8px 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--border); }
    .tool-group { display: flex; gap: 6px; align-items: center; }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--muted); }
    .icon-button:hover { color: var(--ink); background: var(--surface-2); }
    .icon-button svg { width: 17px; height: 17px; }
    .char-count { color: var(--muted); font: 10px var(--mono); }
    .upload-zone { margin-top: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px dashed var(--border); border-radius: var(--radius-sm); color: var(--muted); background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
    .upload-zone strong { color: var(--ink); font-size: 12px; }
    .upload-zone span { font-size: 11px; }
    .upload-zone input { display: none; }
    .upload-zone label { padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface); color: var(--ink); font-size: 11px; cursor: pointer; }
    .prompt-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 18px; }
    .privacy-note { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .privacy-note svg { width: 14px; }
    .generate-button { min-width: 156px; }

    async function simulateGeneration(feature, prompt) {

      const result = document.getElementById('resultPanel');
      button.classList.add('loading');
      button.innerHTML = '<span class="spinner"></span> 正在生成';

      const response = await generateWithApi({ feature: feature.id, prompt });
      state.generated[feature.id] = { ...response, prompt };
      const steps = progress.querySelectorAll('.progress-step');
      steps.forEach(s => s.className = 'progress-step done');
      result.innerHTML = resultMarkup(feature);
      result.hidden = false;
      button.classList.remove('loading');

      if (!asset) return;
      document.getElementById('assetDialogTitle').textContent = asset.title;
      document.getElementById('assetDialogContent').innerHTML = `<div class="dialog-preview"></div><div class="dialog-stats"><div class="dialog-stat"><span>Asset type</span><strong>${asset.type}</strong></div><div class="dialog-stat"><span>Files</span><strong>${asset.files} 个文件</strong></div><div class="dialog-stat"><span>Source</span><strong>${asset.source}</strong></div></div><div class="result-actions"><button class="btn btn-secondary" type="button">下载演示文件</button><button class="btn btn-primary" type="button" data-close-dialog>关闭</button></div>`;
      const dialog = document.getElementById('assetDialog');
      dialog.hidden = false;
      dialog.querySelector('.dialog-close').focus();
      dialog.querySelectorAll('[data-close-dialog]').forEach(btn => btn.addEventListener('click', closeDialog));
    }

    function closeDialog() { document.getElementById('assetDialog').hidden = true; }
    document.querySelector('[data-close-dialog]').addEventListener('click', closeDialog);
    document.getElementById('assetDialog').addEventListener('click', event => { if (event.target.id === 'assetDialog') closeDialog(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') { closeDialog(); closeSidebar(); } });

    function showToast(title, message, success = true) {
      const toast = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastMessage').textContent = message;
      toast.querySelector('.toast-icon').textContent = success ? '✓' : '!';
      toast.querySelector('.toast-icon').style.background = success ? 'var(--success)' : 'var(--danger)';
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 3600);
    }

    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }

    document.querySelectorAll('[data-theme-value]').forEach(btn => btn.addEventListener('click', () => {
      const theme = btn.dataset.themeValue;
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll('[data-theme-value]').forEach(b => b.classList.toggle('active', b === btn));
      localStorage.setItem('archflow_poc_theme', theme);
    }));

    const savedTheme = localStorage.getItem('archflow_poc_theme');
    if (['editorial','blueprint','night'].includes(savedTheme)) {
      document.documentElement.dataset.theme = savedTheme;
      document.querySelectorAll('[data-theme-value]').forEach(btn => btn.classList.toggle('active', btn.dataset.themeValue === savedTheme));
    }

    const sidebar = document.getElementById('sidebar');
    const scrim = document.getElementById('sidebarScrim');
    document.getElementById('menuButton').addEventListener('click', () => { sidebar.classList.add('open'); scrim.hidden = false; });
    scrim.addEventListener('click', closeSidebar);
    function closeSidebar() { sidebar.classList.remove('open'); scrim.hidden = true; }

    document.getElementById('apiStatusButton').addEventListener('click', () => showToast('API 接口已预留', '本 POC 使用本地假数据，后续替换 generateWithApi 即可。'));

    renderNav();
    renderView();
  </script>
</body>
</html>
