name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://mblnorfsegteomazffwy.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Gn8SniEtQm0cnqdEcIS8xw_HIwAl1a5
          VITE_INTERNAL_ACCOUNT_EMAIL: internal-account-1@archflow.local
        run: pnpm build
